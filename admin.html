<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Candidate Applications</title>

  <!-- Paste the SAME Google Apps Script URL you used in index.html -->
  <script>
    const SCRIPT_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
           background: #f8fafc; color: #1f2937; padding: 20px; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: #6b7280; margin-bottom: 20px; font-size: 14px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    input, button {
      padding: 10px 12px; font-size: 14px; border: 1px solid #e5e7eb; border-radius: 8px;
    }
    button { background: #15803d; color: #fff; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background: #166534; }
    .count { color: #6b7280; font-size: 14px; }
    .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
    .msg.err { display: block; background: #fee2e2; color: #dc2626; }
    .wrap { overflow-x: auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    th { background: #f8fafc; position: sticky; top: 0; font-size: 12px; text-transform: uppercase; color: #6b7280; }
    tr:hover td { background: #fafcff; }
    a { color: #15803d; }
    td.intro { max-width: 280px; }
  </style>
</head>
<body>
  <h1>Candidate Applications</h1>
  <p class="sub">Private admin view. Enter your password to load entries straight from your Google Sheet.</p>

  <div class="bar">
    <input type="password" id="key" placeholder="Admin password" />
    <button onclick="load()">Load Applications</button>
    <button onclick="downloadCsv()" style="background:#16a34a">Download CSV</button>
    <span class="count" id="count"></span>
  </div>

  <div class="msg err" id="msg"></div>

  <div class="wrap">
    <table id="tbl"><thead></thead><tbody></tbody></table>
  </div>

  <script>
    let lastRows = [];

    async function load() {
      const key = document.getElementById('key').value.trim();
      const msg = document.getElementById('msg');
      msg.classList.remove('err'); msg.textContent = '';
      if (SCRIPT_URL.startsWith('PASTE_')) {
        return showErr('Add your Google Apps Script URL at the top of this file first.');
      }
      if (!key) return showErr('Please enter the admin password.');

      try {
        const url = SCRIPT_URL + '?action=list&key=' + encodeURIComponent(key);
        const res = await fetch(url);
        const out = await res.json();
        if (out.result !== 'success') return showErr(out.message || 'Could not load data.');
        lastRows = out.rows || [];
        render(lastRows);
      } catch (err) {
        showErr('Connection problem: ' + err.message);
      }
    }

    function render(rows) {
      const thead = document.querySelector('#tbl thead');
      const tbody = document.querySelector('#tbl tbody');
      thead.innerHTML = ''; tbody.innerHTML = '';
      if (!rows.length) { document.getElementById('count').textContent = '0 applications'; return; }

      const header = rows[0];
      const linkCol = header.indexOf('Resume Link');
      thead.innerHTML = '<tr>' + header.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr>';

      // newest first (skip header row 0)
      const body = rows.slice(1).reverse();
      tbody.innerHTML = body.map(r =>
        '<tr>' + r.map((cell, i) => {
          let v = cell == null ? '' : String(cell);
          if (i === linkCol && v.startsWith('http'))
            return '<td><a href="' + esc(v) + '" target="_blank">Open resume</a></td>';
          const cls = (header[i] === 'Self Introduction') ? ' class="intro"' : '';
          return '<td' + cls + '>' + esc(v) + '</td>';
        }).join('') + '</tr>'
      ).join('');

      document.getElementById('count').textContent = body.length + ' application' + (body.length === 1 ? '' : 's');
    }

    function downloadCsv() {
      if (!lastRows.length) return showErr('Load applications first.');
      const csv = lastRows.map(row =>
        row.map(c => '"' + String(c == null ? '' : c).replace(/"/g,'""') + '"').join(',')
      ).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'candidates.csv';
      a.click();
    }

    function showErr(t) { const m = document.getElementById('msg'); m.textContent = t; m.classList.add('err'); }
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    document.getElementById('key').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
  </script>
</body>
</html>
