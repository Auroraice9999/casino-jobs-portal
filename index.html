<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Careers — Open Positions</title>
  <script src="config.js"></script>
  <style>
    :root {
      --brand: #15803d; --brand-dark: #166534;
      --text: #1f2937; --muted: #6b7280; --bg: #f8fafc;
      --card: #ffffff; --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           color: var(--text); background: var(--bg); line-height: 1.55; }

    header { background: var(--card); border-bottom: 1px solid var(--border);
             padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .logo { width: 40px; height: 40px; border-radius: 8px; background: var(--brand);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; }
    .logo-img { height: 40px; }
    header h1 { font-size: 18px; font-weight: 700; }
    nav a { color: var(--brand); font-weight: 600; text-decoration: none; font-size: 14px; }
    nav a:hover { text-decoration: underline; }

    .hero { text-align: center; padding: 56px 20px 32px;
            background: linear-gradient(180deg, #ecfdf5 0%, var(--bg) 100%); }
    .hero h2 { font-size: 32px; margin-bottom: 12px; }
    .hero p { color: var(--muted); font-size: 18px; max-width: 600px; margin: 0 auto; }
    .hero .remote-badge { display: inline-block; margin-bottom: 16px; background: #ecfdf5; color: var(--brand-dark);
            border: 1px solid #bbf7d0; border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 600; }

    .wrap { max-width: 880px; margin: 0 auto; padding: 24px 20px 72px; }
    .section-title { font-size: 20px; font-weight: 700; margin: 12px 4px 18px; }

    .jobs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .job {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; text-decoration: none; color: inherit; display: flex; flex-direction: column;
      transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    }
    .job:hover { box-shadow: 0 8px 24px rgba(0,0,0,.06); border-color: #bbf7d0; transform: translateY(-2px); }
    .job h3 { font-size: 18px; margin-bottom: 6px; color: var(--brand-dark); }
    .job .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { background: #ecfdf5; color: var(--brand-dark); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
    .job p.summary { font-size: 14px; color: var(--text); flex: 1; }
    .apply-link { margin-top: 14px; font-weight: 600; color: var(--brand); font-size: 14px; }

    .about-strip { margin-top: 40px; background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 24px; text-align: center; }
    .about-strip h3 { font-size: 18px; margin-bottom: 8px; }
    .about-strip p { color: var(--muted); font-size: 15px; max-width: 640px; margin: 0 auto 14px; }
    .about-strip a { color: var(--brand); font-weight: 600; text-decoration: none; }

    .contact-note { text-align: center; margin-top: 28px; color: var(--muted); font-size: 14px; }
    .contact-note a { color: var(--brand); font-weight: 600; text-decoration: none; }

    footer { text-align: center; padding: 24px; color: var(--muted); font-size: 13px; }

    @media (max-width: 600px) {
      .hero { padding: 40px 16px 24px; } .hero h2 { font-size: 26px; }
      .jobs { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">
      <img src="logo.svg" alt="Casino Jobs logo" class="logo-img" />
      <h1 id="brandName">Your Company Name</h1>
    </a>
    <nav><a href="about.html">About Us</a></nav>
  </header>

  <section class="hero">
    <span class="remote-badge">All roles 100% Remote</span>
    <h2>We're Hiring!</h2>
    <p id="heroTagline"></p>
  </section>

  <div class="wrap">
    <div class="section-title">Open Positions — click a role to view details &amp; apply</div>
    <div class="jobs" id="jobList"></div>

    <div class="about-strip">
      <h3>About <span id="aboutCompany"></span></h3>
      <p id="aboutBlurb"></p>
      <a href="about.html">Read more about us &rarr;</a>
    </div>

    <p class="contact-note">
      Have a question before applying? Message our HR on Telegram:
      <a id="tgLink" target="_blank" rel="noopener"></a>
    </p>
  </div>

  <footer>&copy; <span id="year"></span> <span id="footerName"></span>. All rights reserved.</footer>

  <script>
    // Branding
    document.getElementById('brandName').textContent = CONFIG.COMPANY_NAME;
    document.getElementById('footerName').textContent = CONFIG.COMPANY_NAME;
    document.getElementById('heroTagline').textContent = CONFIG.COMPANY_TAGLINE;
    document.getElementById('aboutCompany').textContent = CONFIG.COMPANY_NAME;
    document.getElementById('aboutBlurb').textContent =
      CONFIG.COMPANY_NAME + " connects fast-growing iGaming, sports-betting and Web3 companies with top remote talent across India, Bangladesh, Nepal and the wider region.";
    document.title = "Careers — " + CONFIG.COMPANY_NAME;
    document.getElementById('year').textContent = new Date().getFullYear();

    // Telegram contact
    const tg = document.getElementById('tgLink');
    tg.textContent = CONFIG.TELEGRAM_ID;
    tg.href = CONFIG.TELEGRAM_LINK;

    // Build job cards (clicking opens job.html?role=...)
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const list = document.getElementById('jobList');
    CONFIG.JOBS.forEach(job => {
      const a = document.createElement('a');
      a.className = 'job';
      a.href = 'job.html?role=' + encodeURIComponent(job.title);
      a.innerHTML =
        '<h3>' + esc(job.title) + '</h3>' +
        '<div class="meta">' +
          (job.openings ? '<span class="pill">' + esc(job.openings) + ' opening' + (String(job.openings)==='1'?'':'s') + '</span>' : '') +
          (job.type ? '<span class="pill">' + esc(job.type) + '</span>' : '') +
          (job.location ? '<span class="pill">' + esc(job.location) + '</span>' : '') +
        '</div>' +
        '<p class="summary">' + esc(job.summary || '') + '</p>' +
        '<span class="apply-link">View &amp; Apply &rarr;</span>';
      list.appendChild(a);
    });
  </script>
</body>
</html>
